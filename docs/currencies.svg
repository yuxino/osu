<g transform="translate(45 384)"><circle cx="18" cy="18" r="18" fill="#F1E1E6"/><text x="52" y="14" font-size="17" font-weight="800" fill="#4D3244">EUR</text><text x="52" y="35" font-size="11" fill="#8D7480">Eurozone</text><text x="330" y="25" text-anchor="end" font-size="20" font-weight="800" fill="#4D3244">€</text></g>
